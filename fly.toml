# fly.toml app configuration file generated for sanguine-web on 2024-03-01T20:31:59-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sanguine-web'
primary_region = 'dfw'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Suspend (not stop) when idle: the memory snapshot keeps the in-process
  # upstream caches (WOM, Temple, wiki) alive, so a wake-up serves them while
  # refreshing in the background instead of refetching everything cold.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    # One shared CPU. At 250 a crawler fanning out over every /users/:id at once
    # (~200 profile loaders, ~10 queries + a Temple call each) all ran together,
    # pushing every query to 5-10s and tripping Temple's 429s. Past the hard
    # limit Fly's proxy queues requests instead, so they drain at a pace the
    # machine and upstreams can take. Static assets are fast, so a normal page
    # load never gets near it.
    soft_limit = 25
    hard_limit = 50

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
